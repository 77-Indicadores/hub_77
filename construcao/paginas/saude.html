<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saúde da Obra — 77 Gestão · Vértice</title>
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../css/obra.css">
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#08130e">
<link rel="apple-touch-icon" href="../../assets/logo-77-symbol-color.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="77 Gestão">
</head>
<body data-page="saude" data-root="../../">
<div class="stage"><div class="canvas">
  <header class="topbar" id="topo"></header>
  <nav class="pagenav" id="nav"></nav>
  <div class="page" id="app"></div>
</div></div>

<script src="../js/data.js"></script>
<script src="../../js/ui.js"></script>
<script src="../js/obra-ui.js"></script>
<script>
mountShell();
const g = DB.geral;
const cs = DB.curvaS;
const series = [
  {n:'Planejado',  c:'#b78cff', v:cs.planejado, w:2.6, below:true},
  {n:'Realizado físico', c:'#45e594', v:cs.realizado, below:true},
  {n:'Realizado financeiro', c:'#ffc45c', v:cs.financeiro},
  {n:'Projeção no ritmo atual', c:'#ff7b7b', v:cs.projecao, dash:true, w:2.4, label:false}
];
document.getElementById('app').innerHTML = [

  titleband('CRONOGRAMA · OBRA 101 · DUPLICAÇÃO AV. DAS INDÚSTRIAS',
    'Planejado × realizado,',
    'e quando a obra termina de verdade.',
    'Curva S físico-financeira, frentes críticas e a projeção de término no ritmo atual.',
    ['Curva S','Frentes críticas','Previsão de término']),

  kpis([
    {t:'Avanço planejado', v:'64,0%', s:'pelo cronograma contratual', c:'violet'},
    {t:'Avanço realizado', v:'58,0%', d:'−6,0 p.p.', dir:'down', s:'medido em campo', c:'good'},
    {t:'Consumo do orçamento', v:'61,0%', d:'+3,0 p.p.', dir:'down', s:'gasta à frente do avanço', c:'warn'},
    {t:'Término previsto', v:'+38 dias', s:'22/04/2027 no ritmo atual (contrato: 15/03)', c:'red'}
  ]),

  `<div class="main m-21">
    ${panel('Curva S físico-financeira','% acumulado — jan/2026 a mar/2027',
      chartLines(cs.meses, series, {height:440, max:100, suf:'%', hoje:8}),
      {accent:true, legend: legendLines(series)})}
    <div class="col a">
      ${panel('Frentes críticas','Barra clara = planejado · barra cheia = realizado',
        frentesTable(DB.frentes.slice(1,4)))}
      ${panel('Dois cenários','O que fazer com o atraso',
        insights([
          {tone:'warn', ic:'⏱', t:'Manter o prazo', txt:'Ritmo sobe 18%: nova equipe de drenagem e turno na ponte.'},
          {tone:'red',  ic:'↦', t:'Manter o ritmo', txt:'Termina 38 dias depois e custa R$ 612 mil a mais.'}
        ]))}
    </div>
  </div>`

].join('');
</script>
</body>
</html>
