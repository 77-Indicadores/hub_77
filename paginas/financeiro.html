<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Financeiro & Cobrança — 77 Gestão · Bellaria</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#08130e">
<link rel="apple-touch-icon" href="../assets/logo-77-symbol-color.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="77 Gestão">
</head>
<body data-page="financeiro" data-root="../">
<div class="stage"><div class="canvas">
  <header class="topbar" id="topo"></header>
  <nav class="pagenav" id="nav"></nav>
  <div class="page" id="app"></div>
</div></div>

<script src="../js/data.js"></script>
<script src="../js/ui.js"></script>
<script>
mountShell();

document.getElementById('app').innerHTML = [

  titleband('R$ · FINANCEIRO E COBRANÇA',
    'Vender é metade.',
    'Receber é o negócio.',
    'Todo título entra sozinho na régua: lembrete, aviso, cobrança e bloqueio — pelo WhatsApp, registrado no ERP.',
    ['Aging','Régua automática','Bloqueio por crédito']),

  kpis([
    {t:'Total a receber',   v:'R$ 6,84 mi', s:'carteira de recebíveis', c:''},
    {t:'Valor vencido',     v:'R$ 728 mil', d:'10,6%', dir:'down', s:'da carteira total', c:'red'},
    {t:'Inadimplência 90+', v:'R$ 214 mil', d:'-8,2%', dir:'up', s:'caindo desde a régua automática', c:'warn'},
    {t:'Recuperado no mês', v:'R$ 396 mil', d:'+31%', dir:'up', s:'via cobrança automatizada', c:'good'}
  ]),

  `<div class="main m-21">
    <div class="col">
      ${panel('Aging do vencido','Tempo de atraso dos R$ 728 mil — em R$ mil',
        chartBars(DB.aging.slice(1),{height:210, fmt:v=>nf(v)}), {accent:true})}
      ${panel('Régua de cobrança automática','Disparos das últimas 24 horas',
        table(['Etapa','Momento','Hoje','Situação'], DB.regua.slice(0,3).map(r=>[r[0],r[1],r[3],r[4]]), [2]))}
    </div>
    <div class="col">
      ${panel('Composição da carteira','R$ 6,84 mi a receber',
        donut([
          ['#45e594','A vencer — R$ 6,11 mi',6112],
          ['#ffc45c','Vencido até 30d — R$ 382 mil',382],
          ['#ff9d9d','Vencido 31 a 90d — R$ 132 mil',132],
          ['#ff5a5a','Vencido 90+ — R$ 214 mil',214]
        ],'10,6%','ESTÁ VENCIDO'), {center:true})}
      ${panel('Maiores devedores','Por valor vencido em aberto',
        rankList(DB.devedores.slice(0,2).map((d,i)=>({
          n:i+1, l:d[0], s:d[1]+' · '+d[2]+' em atraso', v:d[3], p:d[4], c:d[5]
        })), true))}
    </div>
  </div>`

].join('');
</script>
</body>
</html>
